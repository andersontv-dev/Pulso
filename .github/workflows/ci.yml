name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Un push nuevo cancela la ejecución anterior de la misma rama: no tiene
# sentido gastar minutos validando un commit ya superado.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  verificar:
    name: Lint · Typecheck · Tests · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Los cuatro pasos van por separado y sin `continue-on-error` para que
      # el resumen diga cuál falló, en vez de un único "falló algo".
      - name: Formato
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests unitarios
        run: npm run test

      - name: Build
        run: npm run build
        env:
          # El build no necesita credenciales: getEnv() valida de forma
          # perezosa justamente para que esto funcione.
          PULSO_USE_FIXTURES: '1'

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Solo tiene sentido si lo básico ya pasa.
    needs: verificar

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Chromium para Playwright
        run: npx playwright install --with-deps chromium

      - name: Tests e2e
        run: npm run e2e
        env:
          # Fixtures deterministas: los e2e no dependen de form30x ni de
          # ninguna credencial.
          PULSO_USE_FIXTURES: '1'

      - name: Guardar el informe si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
